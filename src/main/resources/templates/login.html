<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Forget to Remember</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center">Вход</h2>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <div th:if="${param.registered}" class="alert alert-success mt-3">
                Регистрация успешна! Теперь вы можете войти в систему.
            </div>
            <div th:if="${param.error}" class="alert alert-danger mt-3">
                Неверный логин/пароль
            </div>
            <div th:if="${param.logout}" class="alert alert-info mt-3">
                Вы успешно вышли из системы
            </div>
            <p class="text-center mt-3"><a th:href="@{/register}">Нет аккаунта? Зарегистрироваться</a></p>
        </div>
    </div>
</div>
</body>
</html>
</body>
</html>
