<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Мои дни рождения - Forget to Remember</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h2><i class="fas fa-calendar-day"></i> Мои дни рождения</h2>

    <!-- Форма добавления -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Добавить день рождения</h5>
        </div>
        <div class="card-body">
            <form id="addBirthdayForm">
                <div class="row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="Имя" required>
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="contact" name="contact"
                               placeholder="Контакт (опционально)">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-plus"></i> Добавить
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Список дней рождения -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Список дней рождения</h5>
        </div>
        <div class="card-body">
            <div th:if="${birthdays.empty}" class="text-center py-4">
                <i class="fas fa-calendar-times fa-3x text-muted mb-3"></i>
                <p class="text-muted">У вас пока нет добавленных дней рождения</p>
            </div>

            <div class="table-responsive" th:unless="${birthdays.empty}">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Дата</th>
                        <th>Контакт</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="birthday : ${birthdays}" th:data-birthday-id="${birthday.id}">
                        <td th:text="${birthday.name}"></td>
                        <td th:text="${#temporals.format(birthday.date, 'dd.MM.yyyy')}"></td>
                        <td th:text="${birthday.contact} ?: 'Не указан'"></td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1"
                                    th:onclick="'editBirthday(' + ${birthday.id} + ')'">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger"
                                    th:onclick="'deleteBirthday(' + ${birthday.id} + ')'">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- окно редактирования -->
<div class="modal fade" id="editModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать день рождения</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editBirthdayForm">
                    <input type="hidden" id="editId" name="id">
                    <div class="mb-3">
                        <label for="editName" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="editDate" class="form-label">Дата</label>
                        <input type="date" class="form-control" id="editDate" name="date" required>
                    </div>
                    <div class="mb-3">
                        <label for="editContact" class="form-label">Контакт</label>
                        <input type="text" class="form-control" id="editContact" name="contact">
                    </div>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('addBirthdayForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this);
        const dto = {
            name: formData.get('name'),
            date: formData.get('date'),
            contact: formData.get('contact') || ''
        };

        fetch('/api/v1/birthday', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dto)
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при добавлении');
            }
        })
        .catch(error => console.error('Error:', error));
    });

    // Редактирование дня рождения
    function editBirthday(id) {
        console.log("Ищем день рождения с ID:", id);

        const row = document.querySelector(`tr[data-birthday-id="${id}"]`);
        if (!row) {
            alert('День рождения не найден');
            return;
        }

        const name = row.cells[0].textContent;
        const dateStr = row.cells[1].textContent;
        const contact = row.cells[2].textContent === 'Не указан' ? '' : row.cells[2].textContent;

        const [day, month, year] = dateStr.split('.');
        const formattedDate = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;

        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editDate').value = formattedDate;
        document.getElementById('editContact').value = contact;

        new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    document.getElementById('editBirthdayForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const id = document.getElementById('editId').value;
        const formData = new FormData(this);

        const dto = {
            name: formData.get('name'),
            date: formData.get('date'),
            contact: formData.get('contact') || ''
        };

        console.log("Отправляем запрос на обновление для ID:", id, "DTO:", dto);

        fetch('/api/v1/birthday/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dto)
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                response.text().then(text => {
                    alert('Ошибка при обновлении: ' + text);
                });
            }
        })
        .catch(error => console.error('Error:', error));
    });

    function deleteBirthday(id) {
        if (confirm('Вы уверены, что хотите удалить этот день рождения?')) {
            fetch('/api/v1/birthday/' + id, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Ошибка при удалении');
                }
            })
            .catch(error => console.error('Error:', error));
        }
    }
</script>
</body>
</html>
