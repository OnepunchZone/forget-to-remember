<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Публичные поздравления - Forget to Remember</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h2><i class="fas fa-gift"></i> Публичные поздравления</h2>
    <p class="text-muted">Найдите идеальное поздравление из коллекции пользователей</p>

    <!-- Поиск и фильтры -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <input type="text" class="form-control" id="searchInput"
                           placeholder="Поиск по тексту поздравления...">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-primary w-100" onclick="searchGreetings()">
                        <i class="fas fa-search"></i> Найти
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Список публичных поздравлений -->
    <div class="row">
        <div th:each="greeting : ${greetings}" class="col-md-6 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <p class="card-text" th:text="${greeting.text}"></p>
                </div>
                <div class="card-footer">
                    <small class="text-muted">
                        <i class="fas fa-heart text-danger"></i>
                        <span th:text="${greeting.likesCount}"></span> лайков
                    </small>
                    <button class="btn btn-sm btn-outline-danger float-end"
                            th:onclick="'likeGreeting(' + ${greeting.id} + ')'">
                        <i class="fas fa-heart"></i> Лайк
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Пагинация -->
    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/greetings(page=${currentPage - 1})}">Назад</a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-item" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/greetings(page=${i})}" th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/greetings(page=${currentPage + 1})}">Вперед</a>
            </li>
        </ul>
    </nav>

    <div th:if="${greetings.empty}" class="text-center py-5">
        <i class="fas fa-gift fa-3x text-muted mb-3"></i>
        <p class="text-muted">Публичных поздравлений пока нет</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function likeGreeting(id) {
        fetch('/api/v1/greeting/' + id + '/like', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при добавлении лайка');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function unlikeGreeting(id) {
        fetch('/api/v1/greeting/' + id + '/like', {
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'}
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при удалении лайка');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function searchGreetings() {
        const searchText = document.getElementById('searchInput').value;

        alert('Поиск будет реализован в следующем обновлении');
    }
</script>
</body>
</html>
