<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Forget to Remember</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<!-- Вставка хедера -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h2>Привет, <span th:text="${currentUser.username}"></span>!</h2>

    <div class="row">
        <!-- Дни рождения -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-birthday-cake"></i> Ближайшие дни рождения</h4>
                    <a th:href="@{/birthdays}" class="btn btn-sm btn-outline-primary">
                        Все дни рождения
                    </a>
                </div>
                <div class="card-body">
                    <div th:if="${birthdays == null or birthdays.empty}" class="text-center py-3">
                        <p class="text-muted">Нет дней рождения</p>
                    </div>

                    <ul class="list-group list-group-flush">
                        <li th:each="birthday : ${birthdays}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${birthday.name}"></strong>
                                    <small class="text-muted d-block">
                                        <i class="far fa-calendar"></i>
                                        <span th:text="${#temporals.format(birthday.date, 'dd.MM')}"></span>
                                    </small>
                                </div>
                                <span th:if="${birthday.contact}" class="badge bg-info">
                                        <i class="fas fa-paper-plane"></i>
                                        <span th:text="${birthday.contact}"></span>
                                    </span>
                            </div>
                        </li>
                    </ul>

                    <!-- Ссылка "Показать все" -->
                    <div th:if="${birthdayTotalItems > 5}" class="text-center mt-2">
                        <a th:href="@{/birthdays}" class="btn btn-link btn-sm">
                            Показать все (<span th:text="${birthdayTotalItems}"></span>)
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Поздравления -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-gift"></i> Мои поздравления</h4>
                    <a th:href="@{/greetings-my}" class="btn btn-sm btn-outline-success">
                        Все поздравления
                    </a>
                </div>
                <div class="card-body">
                    <div th:if="${greetings == null or greetings.empty}" class="text-center py-3">
                        <p class="text-muted">Нет поздравлений</p>
                    </div>

                    <ul class="list-group list-group-flush">
                        <li th:each="greeting : ${greetings}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="me-2">
                                    <p class="mb-1" th:text="${#strings.abbreviate(greeting.text, 50)}"></p>
                                    <small class="text-muted">
                                        <i class="fas fa-heart text-danger"></i>
                                        <span th:text="${greeting.likesCount}"></span> лайков
                                        <span th:if="${greeting.isPublic}" class="badge bg-success ms-2">
                                                <i class="fas fa-globe"></i> Публичное
                                            </span>
                                    </small>
                                </div>
                                <button class="btn btn-sm btn-outline-primary"
                                        th:onclick="'likeGreeting(' + ${greeting.id} + ')'">
                                    <i class="fas fa-thumbs-up"></i>
                                </button>
                            </div>
                        </li>
                    </ul>

                    <!-- Пагинация для поздравлений -->
                    <div th:if="${greetingTotalPages > 1}" class="mt-3">
                        <nav>
                            <ul class="pagination pagination-sm justify-content-center">
                                <li class="page-item" th:classappend="${greetingCurrentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/dashboard(greetingPage=${greetingCurrentPage - 1})}">
                                        <i class="fas fa-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, greetingTotalPages - 1)}"
                                    th:classappend="${i == greetingCurrentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/dashboard(greetingPage=${i})}" th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${greetingCurrentPage == greetingTotalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/dashboard(greetingPage=${greetingCurrentPage + 1})}">
                                        <i class="fas fa-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>

                    <!-- Ссылка "Показать все" -->
                    <div th:if="${greetingTotalItems > 5}" class="text-center mt-2">
                        <a th:href="@{/greetings-my}" class="btn btn-link btn-sm">
                            Показать все (<span th:text="${greetingTotalItems}"></span>)
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Быстрые действия -->
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h5><i class="fas fa-plus-circle text-primary"></i> Быстрые действия</h5>
                    <div class="mt-3">
                        <button class="btn btn-primary me-2" onclick="showAddBirthdayModal()">
                            <i class="fas fa-birthday-cake"></i> Добавить день рождения
                        </button>
                        <button class="btn btn-success" onclick="showAddGreetingModal()">
                            <i class="fas fa-gift"></i> Создать поздравление
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h5><i class="fas fa-chart-line text-info"></i> Статистика</h5>
                    <div class="row mt-3">
                        <div class="col-6">
                            <div class="border rounded p-2">
                                <i class="fas fa-birthday-cake fa-2x text-primary"></i>
                                <h6 class="mt-2" th:text="${birthdayTotalItems} + ' дней рождения'"></h6>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="border rounded p-2">
                                <i class="fas fa-gift fa-2x text-success"></i>
                                <h6 class="mt-2" th:text="${greetingTotalItems} + ' поздравлений'"></h6>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function likeGreeting(id) {
        fetch('/api/v1/greeting/' + id + '/like', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Ошибка при добавлении лайка');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function showAddBirthdayModal() {
        window.location.href = '/birthdays';
    }

    function showAddGreetingModal() {
        window.location.href = '/greetings-my';
    }
</script>
</body>
</html>
