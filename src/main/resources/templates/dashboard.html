<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Forget to Remember</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Привет, <span th:text="${currentUser.username}"></span>!</h2>
    <div class="row">
        <div class="col-md-6">
            <h3>Мои дни рождения</h3>
            <ul class="list-group">
                <li th:each="birthday : ${birthdays}" class="list-group-item">
                    <strong th:text="${birthday.name}"></strong> (<span th:text="${birthday.date}"></span>)
                    <button class="btn btn-sm btn-primary float-end" onclick="addBirthday()">Добавить</button>
                </li>
            </ul>
        </div>
        <div class="col-md-6">
            <h3>Шаблоны поздравлений</h3>
            <ul class="list-group">
                <li th:each="greeting : ${greetings}" class="list-group-item">
                    <span th:text="${greeting.text}"></span>
                    <span class="badge bg-secondary float-end" th:text="${greeting.likesCount} + лайков"></span>
                    <button class="btn btn-sm btn-success" onclick="likeGreeting(${greeting.id})">Лайк</button>
                </li>
            </ul>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function addBirthday() {
        fetch('/api/v1/birthday', {method: 'POST', body: JSON.stringify({name: 'New', date: '2025-12-25', contact: 'test'}), headers: {'Content-Type': 'application/json'}})
            .then(r => r.json())
            .then(data => location.reload());
    }

    function likeGreeting(id) {
        fetch('/api/v1/greeting/' + id + '/like', {method: 'POST'})
            .then(r => r.json())
            .then(data => location.reload());
    }
</script>
</body>
</html>
