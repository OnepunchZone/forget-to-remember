<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация - Forget to Remember</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Регистрация</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="contact" class="form-label">Contact (Telegram ID)</label>
                    <input type="text" class="form-control" id="contact" name="contact">
                </div>
                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <div id="error" class="alert alert-danger mt-3" style="display: none;"></div>
            <div id="success" class="alert alert-success mt-3" style="display: none;">
                Регистрация успешна!
            </div>
            <p class="text-center mt-3"><a th:href="@{/login}">Уже есть аккаунт? Войти</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const dto = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            email: document.getElementById('email').value,
            contact: document.getElementById('contact').value || ''
        };

        // Только регистрация
        fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dto)
        })
        .then(response => {
            if (response.ok) {
                document.getElementById('success').style.display = 'block';
                document.getElementById('error').style.display = 'none';

                // Перенаправляем на страницу логина после успешной регистрации
                setTimeout(() => {
                    window.location.href = '/login?registered=true';
                }, 2000);
            } else {
                return response.json().then(err => {
                    throw new Error(err.message || 'Ошибка регистрации');
                });
            }
        })
        .catch(error => {
            document.getElementById('error').textContent = error.message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('success').style.display = 'none';
        });
    });
</script>
</body>
</html>
